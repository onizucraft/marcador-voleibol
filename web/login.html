<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar · Marcador Ancora</title>
    <meta name="theme-color" content="#00234b" />
    <meta name="description" content="Marcador de voleibol en directo del Ancora Galapagar" />
    <meta property="og:title" content="Marcador Ancora" />

    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <header class="cabecera">
      <h1><a href="./" class="marca"><img src="/logo-160.webp" alt="" width="160" height="120" /> Marcador Ancora</a></h1>
    </header>
    <main class="contenido estrecho">
      <img class="logo-grande" src="/logo.webp" alt="Ancora Galapagar" width="640" height="480" />

        <h2>Acceso de administrador</h2>

        <label>Contraseña <input name="contrasena" type="password" autocomplete="current-password" required /></label>
        <button class="boton principal" type="submit">Entrar</button>
      </form>
    </main>
    <script type="module" src="./src/login.ts"></script>
